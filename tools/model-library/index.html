<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character model library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b20;color:#eee;font:15px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #343c46}h1{font-size:18px;font-weight:550;margin:0 auto 0 0}.picker{display:flex;align-items:center;gap:8px}select,button,.file-label{border:1px solid #68717c;border-radius:6px;background:#262d35;color:inherit;padding:9px 12px;font:inherit}select{max-width:100%;min-width:225px}button,.file-label{cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid #9acbff;outline-offset:3px}input{display:none}a{color:#9acbff}a[aria-disabled=true]{pointer-events:none;opacity:.5}#version-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;color:#bbc4cf;font-size:13px}#model-name{font-weight:600;color:#eee;font-size:15px}#view{flex:1;min-height:240px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}footer{padding:10px 16px;color:#bbc4cf;display:flex;gap:12px;flex-wrap:wrap;font-size:13px}[hidden]{display:none!important}@media(max-width:600px){h1{width:100%}.picker{width:100%}select{flex:1;min-width:0}header{gap:8px;padding:12px}#version-bar,footer{padding:8px 12px}}
</style>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header><h1>Character models</h1><div class="picker"><label for="model-select">Model</label><select id="model-select" disabled><option>Loading catalog…</option></select></div><div class="picker" id="variant-picker" hidden><label for="variant-select">Version</label><select id="variant-select"></select></div><button id="reset" disabled>Reset view</button><button id="play" hidden>Pause walk</button><button id="rig" aria-pressed="false" hidden>Show rig</button><label class="file-label">Open GLB<input id="file" type="file" accept=".glb"></label><a id="download" aria-disabled="true" download>Download GLB</a></header>
<div id="version-bar"><span id="model-name">Choose a character</span><span id="version">Latest validated versions</span></div>
<main id="view" role="img" aria-label="Interactive character model viewer"></main>
<footer><span id="status" role="status" aria-live="polite">Loading model catalog…</span><span>Drag to rotate · Scroll or pinch to zoom</span></footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const $=id=>document.getElementById(id),view=$('view'),status=$('status'),select=$('model-select'),variantSelect=$('variant-select'),variantPicker=$('variant-picker'),play=$('play'),rig=$('rig'),download=$('download'),reset=$('reset');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x171b20);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;view.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const environment=new RoomEnvironment(),pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(environment,.04).texture;environment.dispose();pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xffffff,0x7b899e,.7));const light=new THREE.DirectionalLight(0xffffff,1.2);light.position.set(2,4,3);scene.add(light);
let model,mixer,helper,grid,current,models=[],loadId=0,controller,localUrl,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const loader=new GLTFLoader();
function disposeModel(object){const geometries=new Set(),materials=new Set(),textures=new Set(),skeletons=new Set();object.traverse(o=>{if(o.isMesh){geometries.add(o.geometry);for(const m of [o.material].flat())if(m){materials.add(m);for(const v of Object.values(m))if(v?.isTexture)textures.add(v)}}if(o.skeleton)skeletons.add(o.skeleton)});geometries.forEach(g=>g.dispose());textures.forEach(t=>t.dispose());materials.forEach(m=>m.dispose());skeletons.forEach(s=>s.dispose())}
function clear(){if(mixer&&model){mixer.stopAllAction();mixer.uncacheRoot(model)}mixer=null;if(helper){scene.remove(helper);helper.dispose();helper=null}if(grid){scene.remove(grid);grid.geometry.dispose();for(const m of [grid.material].flat())m.dispose();grid=null}if(model){scene.remove(model);disposeModel(model);model=null}}
function frameModel(){if(!model)return;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),span=Math.max(size.x,size.y,size.z,.001);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(...(current?.camera||[.85,.4,1.6])).multiplyScalar(span*Math.max(1,1/camera.aspect)));camera.near=span/100;camera.far=span*50;camera.updateProjectionMatrix();controls.update();controls.saveState();return{bounds,span}}
function install(gltf,entry,url){clear();if(localUrl){URL.revokeObjectURL(localUrl);localUrl=null}if(entry.local)localUrl=url;model=gltf.scene;scene.add(model);current=entry;const{bounds,span}=frameModel();grid=new THREE.GridHelper(span*3,24,0x657282,0x35404c);grid.position.y=bounds.min.y-.01;scene.add(grid);helper=new THREE.SkeletonHelper(model);helper.visible=false;helper.material.depthTest=false;helper.renderOrder=10;scene.add(helper);mixer=new THREE.AnimationMixer(model);if(gltf.animations.length)mixer.clipAction(gltf.animations.find(a=>a.name===entry.animation_clip)||gltf.animations[0]).play();let triangles=0,joints=0;model.traverse(o=>{if(o.isMesh)triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;if(o.isBone)joints++});$('model-name').textContent=entry.name;$('version').textContent=entry.local?'Local file':`${entry.version} · ${entry.date}`;status.textContent=`${Math.round(triangles).toLocaleString()} triangles${joints?' · '+joints+' joints':''}${gltf.animations.length?' · Animated':' · Static'}`;view.setAttribute('aria-label',entry.name+' interactive 3D model');play.hidden=!gltf.animations.length;rig.hidden=!joints;play.textContent=(playing?'Pause ':'Play ')+(current?.animation_label||'walk');rig.textContent='Show rig';rig.setAttribute('aria-pressed','false');reset.disabled=false;download.href=url;download.download=entry.file;download.setAttribute('aria-disabled','false');if(!entry.local)history.replaceState(null,'',location.pathname+'?model='+encodeURIComponent(entry.id)+(entry.variant?'&version='+encodeURIComponent(entry.variant):''))}
async function load(entry,file){const id=++loadId;controller?.abort();controller=new AbortController();play.hidden=true;rig.hidden=true;reset.disabled=true;download.setAttribute('aria-disabled','true');status.textContent='Loading '+entry.name+'…';let parsed;try{let bytes;if(file)bytes=await file.arrayBuffer();else{const response=await fetch(entry.file,{signal:controller.signal,cache:'no-cache'});if(!response.ok)throw new Error(`HTTP ${response.status}`);bytes=await response.arrayBuffer()}if(id!==loadId)return;parsed=await loader.parseAsync(bytes,'');if(id!==loadId){disposeModel(parsed.scene);return}const url=file?URL.createObjectURL(file):entry.file;install(parsed,entry,url)}catch(error){if(id!==loadId||error.name==='AbortError')return;status.textContent='Could not load '+entry.name+'. Choose another model or use Open GLB.';console.error(error)}}
function choose(entry,requested){const variants=entry.variants||[];variantPicker.hidden=!variants.length;if(!variants.length){load(entry);return}variantSelect.replaceChildren(...variants.map(v=>{const option=document.createElement('option');option.value=v.id;option.textContent=v.label;return option}));const variant=variants.find(v=>v.id===requested)||variants.find(v=>v.id===(entry.default_variant||entry.default_texture))||variants[0];variantSelect.value=variant.id;load({...entry,...variant,id:entry.id,variant:variant.id})}
select.addEventListener('change',()=>{const entry=models.find(m=>m.id===select.value);if(entry)choose(entry)});
variantSelect.addEventListener('change',()=>{const entry=models.find(m=>m.id===select.value);if(entry)choose(entry,variantSelect.value)});
play.addEventListener('click',()=>{playing=!playing;play.textContent=(playing?'Pause ':'Play ')+(current?.animation_label||'walk')});
rig.addEventListener('click',()=>{if(!helper)return;helper.visible=!helper.visible;rig.textContent=helper.visible?'Hide rig':'Show rig';rig.setAttribute('aria-pressed',String(helper.visible))});reset.addEventListener('click',frameModel);
$('file').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;select.value='';variantPicker.hidden=true;load({id:'local',name:file.name,file:file.name,local:true},file);event.target.value=''});
new ResizeObserver(()=>{const width=view.clientWidth,height=view.clientHeight;if(!width||!height)return;renderer.setSize(width,height);camera.aspect=width/height;camera.updateProjectionMatrix()}).observe(view);
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const delta=Math.min(clock.getDelta(),.1);if(mixer&&playing)mixer.update(delta);controls.update();renderer.render(scene,camera)}frame();
try{const response=await fetch('model-library.json',{cache:'no-store'});if(!response.ok)throw new Error('Catalog unavailable');const catalog=await response.json();models=catalog.models;if(!Array.isArray(models)||!models.length)throw new Error('Empty catalog');select.replaceChildren(...models.map(m=>{const option=document.createElement('option');option.value=m.id;option.textContent=m.name;return option}));select.disabled=false;const requested=new URLSearchParams(location.search).get('model'),initial=models.find(m=>m.id===requested)||models[0];select.value=initial.id;choose(initial,new URLSearchParams(location.search).get('version'))}catch(error){status.textContent='Could not load the model catalog. Use Open GLB to view a saved model.';console.error(error)}
</script>
</body></html>
